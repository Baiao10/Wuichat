<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>WUICHAT</title>
<style>
:root{
  --bg:#111111;--bg2:#1c1c1e;--bg3:#2c2c2e;
  --y:#FFD60A;--r:#E0202A;
  --t:#ffffff;--m:#8e8e93;
  --border:rgba(255,255,255,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:auto;position:relative}
::-webkit-scrollbar{display:none}

/* HEADER */
header.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;background:var(--bg)}
header.top-bar .logo-area{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-0.5px}
header.top-bar .logo-icon{background:linear-gradient(135deg,var(--r),var(--y));width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;font-style:italic}
header.top-bar button{background:none;border:none;color:var(--y);font-size:24px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
header.top-bar button svg{width:24px;height:24px}

/* SEARCH */
.search-bar{padding:0 20px 12px}
.search-input-wrap{display:flex;align-items:center;background:var(--bg2);border:1px solid rgba(255,214,10,0.3);border-radius:12px;padding:10px 14px;gap:10px}
.search-input-wrap svg{width:20px;height:20px;fill:var(--y);opacity:0.8;flex:none}
.search-input-wrap input{background:none;border:none;color:var(--t);font-size:15px;outline:none;flex:1;padding:0;min-width:0}
.search-input-wrap input::placeholder{color:var(--m)}
.bai-ad{background:linear-gradient(90deg,#0056b3,#007bff);color:#fff;font-size:10px;font-weight:800;padding:4px 6px;border-radius:6px;display:flex;align-items:center;gap:4px;flex:none}

/* TABS */
.tabs{display:flex;padding:0 20px 12px;gap:8px}
.tabs button{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--m);padding:10px 4px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.tabs button.active{background:rgba(255,214,10,0.1);color:var(--y);border-color:var(--y)}

/* STORIES */
.stories{display:flex;gap:14px;padding:0 20px 16px;overflow-x:auto;scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;cursor:pointer}
.story .ring{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--r),var(--y));display:grid;place-items:center}
.story .ring img,.story .ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg);background:var(--bg3);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--t)}
.story span{font-size:11px;color:var(--m);max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* CHAT LIST */
.chat-list{flex:1;overflow-y:auto;padding:0 10px 80px}
.sec-title{font-size:12px;font-weight:700;color:var(--y);letter-spacing:1px;padding:16px 10px 8px;text-transform:uppercase}
.row-chat{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:16px;cursor:pointer;transition:background .2s}
.row-chat:hover{background:rgba(255,255,255,0.04)}
.row-chat .av{width:54px;height:54px;border-radius:50%;background:var(--bg3);flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:20px;position:relative}
.row-chat .av img{width:100%;height:100%;object-fit:cover}
.row-chat .av.on::after{content:"";position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:50%;background:#34c759;border:2px solid var(--bg)}
.row-chat .av.group{border-radius:14px}
.row-chat .info{flex:1;min-width:0;border-bottom:1px solid var(--border);padding-bottom:12px;display:flex;flex-direction:column;justify-content:center}
.row-chat:last-child .info{border-bottom:none}
.row-chat .name-time{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.row-chat .name-time b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-chat .name-time small{font-size:12px;color:var(--y)}
.row-chat .name-time small.old{color:var(--m)}
.row-chat .msg-prev{font-size:14px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{background:var(--y);color:#111;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}

/* BOTTOM NAV */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:65px;background:var(--bg);display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--border);z-index:10}
.bottom-nav button{background:none;border:none;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;cursor:pointer;padding:10px}
.bottom-nav button.active{color:var(--y)}
.bottom-nav svg{width:22px;height:22px;fill:currentColor}

/* CHAT */
.chat-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);z-index:10}
.chat-header button{background:none;border:none;color:var(--t);font-size:24px;padding:4px;cursor:pointer}
.chat-header .av{width:40px;height:40px;font-size:16px}
.chat-header .title{flex:1}
.chat-header .title h1{margin:0;font-size:16px;font-weight:600}
.chat-header .title p{margin:0;font-size:12px;color:var(--m)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:10px 14px;border-radius:16px;background:var(--bg2);word-wrap:break-word;position:relative;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.b.me{align-self:flex-end;background:var(--y);color:#111}
.b small{display:block;color:var(--m);font-size:11px;margin-top:4px;text-align:right}
.b.me small{color:rgba(0,0,0,0.5)}
.b .who{font-size:12px;color:var(--y);font-weight:700;margin-bottom:2px}
.b img{max-width:100%;border-radius:10px;display:block}
.b.st{background:none!important;padding:4px;font-size:44px;line-height:1.1;text-align:center}
.b.st b{display:block;font-size:15px;color:var(--y)}
.b.st.me b{color:#111}

.bar{display:flex;gap:8px;padding:12px 16px;background:var(--bg2);align-items:center;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.bar input{flex:1;background:var(--bg3);border:1px solid transparent;border-radius:20px;padding:12px 16px;color:var(--t);font-size:16px;outline:none;min-width:0}
.bar input:focus{border-color:var(--y)}
.bar button{background:var(--y);color:#111;border:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}
.bar button.media{background:var(--bg3);color:var(--t)}
#stk{display:none;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:var(--bg2);border-top:1px solid var(--border);max-height:220px;overflow-y:auto}
#stk button{background:var(--bg3);color:var(--t);border-radius:12px;padding:10px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;cursor:pointer}
#stk button span{font-size:24px}

/* PERFIL */
.profile-view{padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow-y:auto;flex:1}
.profile-view .av{width:100px;height:100px;font-size:40px;border:3px solid var(--y);border-radius:50%;position:relative;display:grid;place-items:center;overflow:visible;background:var(--bg3)}
.profile-view .av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.profile-view .edit-badge{position:absolute;bottom:0;right:0;background:var(--y);color:#111;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;border:3px solid var(--bg);cursor:pointer;z-index:2}
.profile-view h2{margin:0;font-size:22px}
.profile-view p{margin:0;color:var(--m)}
.profile-view input{width:100%;max-width:300px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--t);text-align:center;font-size:16px;outline:none}
.profile-view input:focus{border-color:var(--y)}
.profile-view button.save{width:100%;max-width:300px;background:var(--y);color:#111;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}
.profile-view button.logout{background:none;color:var(--r);border:1px solid var(--r);padding:12px;border-radius:12px;margin-top:20px;width:100%;max-width:300px;cursor:pointer}

/* LOGIN */
.login-screen{padding:40px 24px;display:flex;flex-direction:column;justify-content:center;height:100%;gap:16px;flex:1;overflow-y:auto}
.login-screen h1{text-align:center;font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:20px}
.login-screen h1 span{color:var(--y)}
.login-screen input{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;color:var(--t);font-size:16px;outline:none}
.login-screen input:focus{border-color:var(--y)}
.login-screen button{background:var(--y);color:#111;border:none;padding:16px;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer}

/* TOAST */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--bg3);border:1px solid var(--border);padding:12px 20px;border-radius:16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:1000;transition:.3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;width:90%;max-width:400px}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .t-av{width:36px;height:36px;border-radius:50%;background:var(--y);color:#111;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
#toast .t-av img{width:100%;height:100%;object-fit:cover}
#toast .t-txt{min-width:0}
#toast .t-txt b{display:block;font-size:14px}
#toast .t-txt span{display:block;font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"><div class="t-av" id="tAv"></div><div class="t-txt"><b id="tName"></b><span id="tMsg"></span></div></div>

<script>
const $=s=>document.querySelector(s);
let ws,me,S={users:{},groups:{},online:[]},cur=null,H={},low=localStorage.low==='1';
let unread={},lastMsg={},profilePhoto=null,notifReady=false;

const ST=[['😄','WUI!'],['😠','TA A BAZAR?'],['👍','VAMOS KUIAR'],['🤝','MANO'],['🎧','MÔ DEEJAY'],['😎','TA FIXE'],['👋','BAZEI'],['😮','XÊ!'],['🥳','KANDENGUE'],['🕶️','WI RIJO'],['😌','NÃO TEM MACA'],['💃','ESTÁ A BATER'],['🏃','TÔ A VIR'],['👀','TALA'],['🙌','BUÉ DE FIXE'],['🤙','MBORA'],['✌️','SEM STRESS'],['🔥','TÁ FOGO!'],['👌','BOA!'],['😁','TÁ SUAVE']];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>esc((n||'?').trim()[0].toUpperCase());
const dmId=(a,b)=>'d:'+[a,b].sort().join('_');
const name=p=>(S.users[p]||{}).name||p;
const photo=p=>(S.users[p]||{}).photo||null;

const avatar=(p,cls='')=>{
  const ph=photo(p);
  return `<div class="av ${cls}">${ph?`<img src="${esc(ph)}" alt="">`:ini(name(p))}</div>`;
};
const previewOf=m=>{
  if(!m)return'';
  if(m.kind==='image')return'📷 Imagem';
  if(m.kind==='audio')return'🎤 Áudio';
  if(m.kind==='sticker')return'🎨 Sticker · '+(m.body.split('|')[1]||'');
  return m.body;
};

const ICONS={
  camera:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>`,
  menu:`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>`,
  search:`<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>`,
  chat:`<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>`,
  megaphone:`<svg viewBox="0 0 24 24"><path d="M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z"/></svg>`,
  people:`<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`,
  phone:`<svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>`
};

async function initNotif(){
  if(!('Notification'in window))return;
  if(Notification.permission==='granted'){notifReady=true;return}
  if(Notification.permission==='default'){try{const p=await Notification.requestPermission();notifReady=p==='granted'}catch(e){}}
}
function updateTitle(){
  const n=Object.values(unread).reduce((a,b)=>a+b,0);
  document.title=(n?'('+n+') ':'')+'WUICHAT';
  if('setAppBadge'in navigator)navigator.setAppBadge(n||0).catch(()=>{});
}
function notify(msg){
  const from=name(msg.from),txt=previewOf(msg),chat=msg.chat;
  const av=$('#tAv'),nm=$('#tName'),ms=$('#tMsg');
  if(photo(msg.from))av.innerHTML=`<img src="${esc(photo(msg.from))}">`;else av.textContent=from[0].toUpperCase();
  nm.textContent=from;ms.textContent=txt;
  $('#toast').classList.add('show');
  clearTimeout(notify._t);
  notify._t=setTimeout(()=>$('#toast').classList.remove('show'),3200);
  navigator.vibrate&&navigator.vibrate([40,60,40]);
  if(notifReady&&document.visibilityState!=='visible'){
    try{
      const n=new Notification('WUICHAT · '+from,{body:txt,icon:'icon.svg',tag:chat,data:{chat}});
      n.onclick=()=>{window.focus();openChat(msg.chat);n.close()};
    }catch(e){}
  }
}

function conn(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{if(localStorage.token)send({t:'login',token:localStorage.token})};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='ready'){me=m.me;Object.assign(S,m);profilePhoto=photo(me);cur?chat():home()}
    if(m.t==='users'){Object.assign(S,m);if(!cur)home()}
    if(m.t==='err'){localStorage.removeItem('token');login()}
    if(m.t==='hist'){H[m.chat]=m.msgs;if(cur&&cur.id===m.chat)draw()}
    if(m.t==='msg'){
      const msg=m.msg;
      (H[msg.chat]=H[msg.chat]||[]).push(msg);
      lastMsg[msg.chat]=msg;
      if(msg.from!==me){
        const open=cur&&cur.id===msg.chat;
        if(!open){
          unread[msg.chat]=(unread[msg.chat]||0)+1;
          updateTitle();
          notify(msg);
        }
      }
      if(cur&&cur.id===msg.chat){unread[msg.chat]=0;updateTitle();draw()}
      else if(!cur){home()}
    }
  };
  ws.onclose=()=>setTimeout(conn,2000);
}
const send=o=>ws.readyState===1&&ws.send(JSON.stringify(o));
const post=async(u,b)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return{ok:r.ok,j:await r.json().catch(()=>({}))}};

function login(){
  cur=null;
  $('#app').innerHTML=`
  <div class="login-screen">
    <h1>WUI<span>CHAT</span></h1>
    <div id="lg" style="display:flex;flex-direction:column;gap:16px">
      <input id="n" placeholder="O teu nome" value="${esc(localStorage.name||'')}" autocomplete="name">
      <input id="p" type="tel" placeholder="Telemóvel (9 dígitos)" value="${esc(localStorage.phone||'')}" autocomplete="tel">
      <button id="go">Receber código SMS</button>
    </div>
  </div>`;
  $('#go').onclick=async()=>{
    const nameV=$('#n').value.trim(),phone=$('#p').value.trim();
    localStorage.name=nameV;localStorage.phone=phone;
    const r=await post('/api/code',{name:nameV,phone});
    if(!r.ok)return alert(r.j.msg);
    $('#lg').innerHTML=`
      <p style="text-align:center;color:var(--m);margin:0">Código enviado por SMS:</p>
      ${r.j.dev?`<div style="text-align:center;background:rgba(255,214,10,.1);border:1px solid var(--y);padding:10px;border-radius:10px;color:var(--y)">Código: <b>${esc(r.j.dev)}</b></div>`:''}
      <input id="c" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" style="text-align:center;font-size:24px;letter-spacing:8px">
      <button id="vf">Confirmar</button>`;
    $('#vf').onclick=async()=>{
      const v=await post('/api/verify',{name:nameV,phone,code:$('#c').value});
      if(!v.ok)return alert(v.j.msg);
      localStorage.token=v.j.token;initNotif();send({t:'login',token:v.j.token});
    };
  };
}

async function up(blob,ext){
  const r=await fetch('/api/upload?ext='+ext+'&token='+localStorage.token,{method:'POST',body:blob});
  if(!r.ok){alert('Falha no envio');return}
  return (await r.json()).url;
}

function home(){
  cur=null;updateTitle();
  const gs=Object.entries(S.groups).filter(([,g])=>g.members.includes(me));
  const us=Object.values(S.users).filter(u=>u.phone!==me);
  const stories=us.slice(0,5);

  $('#app').innerHTML=`
  <header class="top-bar">
    <button id="pf" style="padding-left:0">${ICONS.camera}</button>
    <div class="logo-area"><div class="logo-icon">W</div> wuichat</div>
    <button id="ng">${ICONS.menu}</button>
  </header>

  <div class="search-bar">
    <div class="search-input-wrap">
      ${ICONS.search}
      <input placeholder="Perguntar ou pesquisar">
      <div class="bai-ad"><span>BAI</span> Conta Fácil</div>
    </div>
  </div>

  <div class="tabs">
    <button class="active">Todas</button>
    <button>Não lidas</button>
    <button>Pessoas</button>
    <button>Grupos</button>
  </div>

  <div class="stories">
    ${stories.map(u=>`
      <div class="story" data-id="${dmId(me,u.phone)}" data-n="${esc(u.name)}">
        <div class="ring">${u.photo?`<img src="${esc(u.photo)}">`:`<div class="ph">${ini(u.name)}</div>`}</div>
        <span>${esc(u.name.split(' ')[0])}</span>
      </div>`).join('')||''}
  </div>

  <div class="chat-list">
    ${us.map(u=>{
      const id=dmId(me,u.phone);
      const un=unread[id]||0;
      const lm=lastMsg[id];
      const on=S.online.includes(u.phone);
      const time=lm?new Date(lm.ts).toLocaleTimeString('pt',{hour:'2-digit',minute:'2-digit'}):'';
      return `<div class="row-chat" data-id="${id}" data-n="${esc(u.name)}">
        ${avatar(u.phone,on?'on':'')}
        <div class="info">
          <div class="name-time"><b>${esc(u.name)}</b><small class="${un?'':'old'}">${time}</small></div>
          <div class="msg-prev"><span>${lm?esc(previewOf(lm)):(on?'online':'offline')}</span>${un?`<div class="badge">${un}</div>`:''}</div>
        </div>
      </div>`;
    }).join('')}

    ${gs.length?'<div class="sec-title">Grupos</div>':''}

    ${gs.map(([id,g])=>{
      const un=unread['g:'+id]||0;
      const lm=lastMsg['g:'+id];
      const time=lm?new Date(lm.ts).toLocaleDateString('pt',{day:'2-digit',month:'short'}):'';
      return `<div class="row-chat" data-id="g:${id}" data-n="${esc(g.name)}">
        <div class="av group" style="background:#8b4513;color:#ffd700">${ini(g.name)}</div>
        <div class="info">
          <div class="name-time"><b>${esc(g.name)}</b><small class="${un?'':'old'}">${un?`<div class="badge">${un>9?'9+':un}</div>`:time}</small></div>
          <div class="msg-prev"><span>${lm?esc(previewOf(lm)):g.members.length+' membros'}</span></div>
        </div>
      </div>`;
    }).join('')}
  </div>

  <nav class="bottom-nav">
    <button class="active">${ICONS.chat} Conversas</button>
    <button>${ICONS.megaphone} Canais</button>
    <button>${ICONS.people} Comunidades</button>
    <button>${ICONS.phone} Chamadas</button>
  </nav>`;

  document.querySelectorAll('.row-chat, .story').forEach(r=>r.onclick=()=>{
    const id=r.dataset.id;
    unread[id]=0;updateTitle();
    cur={id,n:r.dataset.n};send({t:'hist',chat:id});chat();
  });
  $('#pf').onclick=profile;
  $('#ng').onclick=()=>{
    const n=prompt('Nome do grupo:');if(!n)return;
    const ph=prompt('Telemóveis dos membros, separados por vírgula:','');
    send({t:'group',name:n,members:(ph||'').split(',').map(x=>x.replace(/\D/g,'')).filter(Boolean)});
  };
}

function profile(){
  cur=null;
  const ph=photo(me);
  $('#app').innerHTML=`
  <header class="top-bar">
    <button id="bk" style="color:var(--t)">←</button>
    <div class="logo-area" style="font-size:18px">O teu Perfil</div>
    <div style="width:24px"></div>
  </header>
  <div class="profile-view">
    <div class="av">
      ${ph?`<img src="${esc(ph)}">`:ini(name(me))}
      <div class="edit-badge" id="editAv">✎</div>
    </div>
    <h2 id="pn">${esc(name(me))}</h2>
    <p>+244 ${esc(me)}</p>
    <input id="nm" value="${esc(name(me))}" maxlength="30" placeholder="O teu nome">
    <button class="save" id="sv">Guardar alterações</button>
    <button class="logout" id="lo">Terminar sessão</button>
  </div>`;

  $('#bk').onclick=home;
  $('#editAv').onclick=()=>pickPhoto();
  $('#sv').onclick=async()=>{
    const nm=$('#nm').value.trim();
    if(!nm)return alert('O nome não pode estar vazio.');
    const r=await post('/api/profile',{token:localStorage.token,name:nm});
    if(!r.ok)return alert(r.j.msg||'Falha ao guardar');
    S.users[me]=S.users[me]||{};S.users[me].name=nm;
    localStorage.name=nm;$('#pn').textContent=nm;alert('Perfil atualizado!');
  };
  $('#lo').onclick=()=>{
    if(!confirm('Terminar sessão?'))return;
    localStorage.removeItem('token');send({t:'logout'});login();
  };
}

function pickPhoto(){
  const fi=document.createElement('input');fi.type='file';fi.accept='image/*';
  fi.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const bm=await createImageBitmap(f),k=Math.min(1,512/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    c.toBlob(async b=>{
      const u=await up(b,'jpg');
      if(!u)return;
      profilePhoto=u;
      await post('/api/profile',{token:localStorage.token,photo:u});
      S.users[me]=S.users[me]||{};S.users[me].photo=u;
      profile(); // volta a desenhar o perfil com a nova foto
    },'image/jpeg',.82);
  };
  fi.click();
}

function openChat(id){
  const n = id.startsWith('g:')
    ? (S.groups[id.slice(2)]||{}).name||'Grupo'
    : name(id.slice(2).split('_').find(x=>x!==me)||'Chat');
  cur={id,n};send({t:'hist',chat:id});chat();
}

function chat(){
  const grp=cur.id.startsWith('g:');
  const otherPhone=grp?null:cur.id.slice(2).split('_').find(x=>x!==me);
  const ph=grp?null:photo(otherPhone);
  const on=grp?false:S.online.includes(otherPhone);
  const headAv=grp
    ?`<div class="av" style="width:40px;height:40px;border-radius:12px;font-size:16px">${ini(cur.n)}</div>`
    :`<div class="av ${on?'on':''}" style="width:40px;height:40px;font-size:16px">${ph?`<img src="${esc(ph)}">`:ini(cur.n)}</div>`;

  $('#app').innerHTML=`
  <div class="chat-header">
    <button id="bk">←</button>
    ${headAv}
    <div class="title"><h1>${esc(cur.n)}</h1><p>${grp?'grupo':(on?'online':'offline')}</p></div>
  </div>
  <div id="msgs"></div>
  <div id="stk">${ST.map((s,i)=>`<button data-i="${i}"><span>${s[0]}</span>${s[1]}</button>`).join('')}</div>
  <div class="bar">
    <input id="t" placeholder="Escreve uma mensagem..." autocomplete="off">
    ${low?'':`<button class="media" id="sb">😄</button>
    <button class="media" id="im">📷</button>
    <button class="media" id="mc">🎤</button>
    <input id="fi" type="file" accept="image/*" hidden>`}
    <button id="sd">➤</button>
  </div>`;

  $('#bk').onclick=home;
  draw();
  const out=(kind,body)=>send({t:'msg',to:grp?cur.id:otherPhone,kind,body});
  const go=()=>{const v=$('#t').value.trim();if(v){out('text',v);$('#t').value='';}};
  $('#sd').onclick=go;
  $('#t').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
  if(!low){
    wireMedia(out);
    $('#sb').onclick=()=>{const s=$('#stk');s.style.display=s.style.display==='grid'?'none':'grid';};
    document.querySelectorAll('#stk button').forEach(b=>b.onclick=()=>{
      out('sticker',ST[b.dataset.i].join('|'));$('#stk').style.display='none';
    });
  }
}

function wireMedia(out){
  $('#im').onclick=()=>$('#fi').click();
  $('#fi').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const bm=await createImageBitmap(f),k=Math.min(1,1024/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    c.toBlob(async b=>{const u=await up(b,'jpg');u&&out('image',u);},'image/jpeg',.72);
    e.target.value='';
  };
  let rec,ch=[];
  $('#mc').onclick=async()=>{
    if(rec&&rec.state==='recording'){rec.stop();return;}
    try{
      const st=await navigator.mediaDevices.getUserMedia({audio:true});
      rec=new MediaRecorder(st);ch=[];
      rec.ondataavailable=e=>ch.push(e.data);
      rec.onstop=async()=>{
        st.getTracks().forEach(t=>t.stop());$('#mc').textContent='🎤';
        const b=new Blob(ch,{type:rec.mimeType});
        const u=await up(b,rec.mimeType.includes('mp4')?'m4a':'webm');
        u&&out('audio',u);
      };
      rec.start();$('#mc').textContent='⏹️';
    }catch{alert('Permite o acesso ao microfone.');}
  };
}

function draw(){
  const box=$('#msgs');if(!box)return;
  const grp=cur.id.startsWith('g:');
  box.innerHTML=(H[cur.id]||[]).map(m=>{
    const mine=m.from===me;
    const t=new Date(m.ts).toLocaleTimeString('pt',{hour:'2-digit',minute:'2-digit'});
    const who=grp&&!mine?`<div class="who">${esc(name(m.from))}</div>`:'';
    if(m.kind==='image'||m.kind==='audio'){
      const c=low?'<i style="opacity:.6">['+(m.kind==='image'?'imagem':'áudio')+' · modo sem saldo]</i>'
        :m.kind==='image'?`<img src="${esc(m.body)}" loading="lazy" alt="">`
        :`<audio controls preload="none" src="${esc(m.body)}"></audio>`;
      return `<div class="b ${mine?'me':''}">${who}${c}<small>${t}</small></div>`;
    }
    if(m.kind==='sticker'){
      const[e,w]=m.body.split('|');
      return low?`<div class="b ${mine?'me':''}">${who}[sticker] ${esc(w)}<small>${t}</small></div>`
        :`<div class="b st ${mine?'me':''}" style="align-self:${mine?'flex-end':'flex-start'}">${who}${e}<b>${esc(w)}</b><small>${t}</small></div>`;
    }
    return `<div class="b ${mine?'me':''}">${who}${esc(m.body)}<small>${t}</small></div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
}

// Arranque
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')updateTitle();});
login();
conn();
</script>
</body>
